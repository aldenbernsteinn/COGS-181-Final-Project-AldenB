# Custom lightweight YOLOv8 for CPU-optimized UI element detection.
#
# Design choices vs standard yolov8n:
#   - Halved channel widths (32/64/128/256 vs 64/128/256/512/1024)
#   - Fewer C2f repeats (2 vs 3-6) for reduced computation
#   - Removed P5/32 detection head (UI elements are medium-sized, not tiny)
#   - Only 2 detection scales (P3/8 + P4/16) instead of 3
#   - ~60% fewer parameters, ~2x faster on CPU
#
# Usage:
#   model = YOLO("models/custom_yolo.yaml")
#   model.train(data="data/raw/dataset.yaml", epochs=50)

# Parameters
nc: 5  # 5 merged UI element classes
scales:
  n: [0.33, 0.25, 1024]  # use nano scaling

# Backbone — lightweight feature extraction
backbone:
  - [-1, 1, Conv, [32, 3, 2]]       # 0-P1/2: 32ch (vs 64)
  - [-1, 1, Conv, [64, 3, 2]]       # 1-P2/4: 64ch (vs 128)
  - [-1, 2, C2f, [64, True]]        # 2: 2 repeats (vs 3)
  - [-1, 1, Conv, [128, 3, 2]]      # 3-P3/8: 128ch (vs 256)
  - [-1, 3, C2f, [128, True]]       # 4: 3 repeats (vs 6)
  - [-1, 1, Conv, [256, 3, 2]]      # 5-P4/16: 256ch (vs 512)
  - [-1, 3, C2f, [256, True]]       # 6: 3 repeats (vs 6)
  - [-1, 1, SPPF, [256, 5]]         # 7: SPPF at 256ch (vs 1024)

# Head — 2-scale detection (P3 + P4), skip P5 for speed
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 8: upsample
  - [[-1, 4], 1, Concat, [1]]                     # 9: cat with backbone P3
  - [-1, 2, C2f, [128]]                           # 10: P3/8-small objects

  - [-1, 1, Conv, [128, 3, 2]]                    # 11: downsample
  - [[-1, 7], 1, Concat, [1]]                     # 12: cat with backbone P4
  - [-1, 2, C2f, [256]]                           # 13: P4/16-medium objects

  - [[10, 13], 1, Detect, [nc]]                   # 14: detect on P3+P4
